name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: HH-JOB-BOT
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: POSTGRES_PASSWORD,BOT_TOKEN,ENCRYPTION_KEY,HEAVY_TASKS_MODE,ENABLE_CELERY_BEAT
          script: |
            cd /opt/jobot
            git pull origin main
            git submodule update --init --recursive

            install -d -m 700 ./secrets
            printf "%s" "$POSTGRES_PASSWORD" > ./secrets/postgres_password
            printf "%s" "$BOT_TOKEN" > ./secrets/bot_token
            printf "%s" "$ENCRYPTION_KEY" > ./secrets/encryption_key
            chmod 600 ./secrets/postgres_password ./secrets/bot_token ./secrets/encryption_key

            docker compose up -d postgres
            until docker compose exec -T postgres pg_isready -U hh_bot -d hh_bot; do
              sleep 2
            done

            docker compose build hh-bot
            docker compose run --rm hh-bot alembic upgrade head
            if [ "${HEAVY_TASKS_MODE:-celery}" = "celery" ]; then
              services="hh-bot hh-bot-worker"
              if [ "${ENABLE_CELERY_BEAT:-false}" = "true" ]; then
                available_services="$(docker compose config --services)"
                case "${available_services}" in
                  *"hh-bot-beat"*)
                    services="${services} hh-bot-beat"
                    ;;
                  *)
                    echo "ENABLE_CELERY_BEAT=true, но сервис hh-bot-beat отсутствует в compose. Пропускаем запуск beat."
                    ;;
                esac
              fi
              docker compose up -d --remove-orphans ${services}

              echo "Running worker readiness checks..."
              docker compose exec -T hh-bot python scripts/worker_readiness_check.py --timeout 15

              echo "Running post-deploy heavy smoke..."
              docker compose exec -T hh-bot python scripts/post_deploy_heavy_smoke.py --timeout 90 --artifact-path /tmp/post_deploy_heavy_smoke.json
              docker compose exec -T hh-bot python -c "from pathlib import Path; path = Path('/tmp/post_deploy_heavy_smoke.json'); assert path.exists(), 'Smoke artifact not found: /tmp/post_deploy_heavy_smoke.json'; print('post-deploy-heavy-smoke:', path.read_text(encoding='utf-8'))"
            else
              docker compose up -d --remove-orphans hh-bot
            fi
            docker image prune -f
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          HEAVY_TASKS_MODE: ${{ vars.HEAVY_TASKS_MODE }}
          ENABLE_CELERY_BEAT: ${{ vars.ENABLE_CELERY_BEAT }}
